<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEase - Appointments</title>
    
    <style>
        /* --- Global Resets & Variables --- */
        :root {
            --sidebar-dark: #0f223f;
            --sidebar-light: #133261;
            --sidebar-active: #0a4da3;
            --bg-color: #f4f6f9;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- Layout --- */
        .layout {
            display: flex;
            height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-dark);
            display: flex;
            flex-direction: column;
            color: white;
            flex-shrink: 0;
        }

        .sidebar-top {
            background-color: var(--sidebar-light);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            background-color: #cbd5e1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            color: #475569;
        }

        .profile-icon svg {
            width: 50px;
            height: 50px;
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .profile-role {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .sidebar-nav {
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 25px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .nav-link.active {
            background-color: var(--sidebar-active);
            color: white;
            font-weight: 500;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .topbar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .notification {
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification svg {
            width: 24px;
            height: 24px;
        }

        /* Dashboard Content Area */
        .dashboard-content {
            padding: 30px 40px;
            max-width: 1000px; 
            width: 100%;
            margin: 0 auto;
        }

        /* --- Tabs Navigation --- */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
            gap: 40px;
        }

        .tab {
            padding: 10px 0;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .tab:hover {
            color: var(--text-main);
        }

        .tab.active {
            color: var(--text-main);
            border-bottom: 2px solid #111827; 
        }

        /* --- Table Container --- */
        .table-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden; 
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        /* Table Headers */
        th {
            background-color: #ffffff;
            padding: 20px 25px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        th:last-child {
            border-right: none;
        }

        /* Table Data */
        td {
            padding: 18px 25px;
            font-size: 0.9rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            vertical-align: middle;
        }

        td:last-child {
            border-right: none;
        }

        /* Empty Rows for spacing (as seen in image) */
        .empty-row td {
            height: 60px;
            padding: 0;
            border-right: 1px solid var(--border-color);
        }
        .empty-row td:last-child {
            border-right: none;
        }

        /* --- Status Badges --- */
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 6px; /* Slightly less rounded than payments */
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-pending {
            background-color: #fffbeb; /* Light yellow */
            color: #d97706; /* Orange text */
            border: 1px solid #fde68a;
        }

        /* --- Action Buttons (Check / Cross) --- */
        .action-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
        }

        /* Approve (Check) Button */
        .btn-approve {
            border: 1px solid #10b981;
            color: #10b981;
        }
        .btn-approve:hover {
            background-color: #10b981;
            color: white;
        }

        /* Reject (Cross) Button */
        .btn-reject {
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .btn-reject:hover {
            background-color: #ef4444;
            color: white;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                height: auto;
            }
            body {
                overflow-y: auto;
            }
            .table-container {
                overflow-x: auto; 
            }
            .topbar, .dashboard-content {
                padding: 20px;
            }
            .tabs {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            
            <div class="sidebar-top">
                <div class="profile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h3 class="profile-name">RMDC</h3>
                <p class="profile-role">Admin</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="units.html" class="nav-link">Units</a>
                <a href="tenants.html" class="nav-link">Tenants</a>
                <a href="payments.html" class="nav-link">Payments</a>
                <a href="appointments.html" class="nav-link active">Appointments</a>
                <a href="maintenance.html" class="nav-link">Maintenance</a>
                <a href="reports.html" class="nav-link">Reports</a>
                <a href="settings.html" class="nav-link">Settings</a>
                <a href="index.html" class="nav-link" style="margin-top: auto;">Logout</a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">
                <h1>Appointment Viewing</h1>
                <div class="notification">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </div>
            </header>

            <section class="dashboard-content">

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active">Upcoming (1)</button>
                    <button class="tab">Pending (0)</button>
                </div>

                <!-- Data Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Unit</th>
                                <th>Date & Time</th>
                                <th>Prospective Tenant</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Row 1 -->
                            <tr>
                                <td>2B</td>
                                <td>
                                    September 3, 2026<br>
                                    <span style="color: var(--text-muted); font-size: 0.85rem;">10:00 AM</span>
                                </td>
                                <td>Juan Juan</td>
                                <td><span class="status-badge badge-pending">Pending</span></td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-icon btn-approve" title="Approve">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                        </button>
                                        <button class="btn-icon btn-reject" title="Reject">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>

                            <!-- Empty Rows to match the visual spacing in the screenshot -->
                            <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td></tr>
                        </tbody>
                    </table>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
