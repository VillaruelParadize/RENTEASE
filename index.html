<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RentEase - Welcome</title>

    <link rel="stylesheet" href="css/welcome.css">
</head>

<body>

    <div class="welcome-container">

        <div class="welcome-card">

            <div class="logo">🏠</div>

            <h1>Welcome to RentEase</h1>

            <p class="subtitle">
                RMDC Rental Apartment Management System
            </p>

            <p class="choose-text">
                Please select your role to continue
            </p>

            <div class="role-buttons">

                <!-- ADMIN -->
                <a href="login.html?role=admin" class="role-button">
                    <span class="role-icon">👨‍💼</span>

                    <div>
                        <strong>Admin</strong>
                        <small>Manage the apartment system</small>
                    </div>
                </a>

                <!-- CURRENT TENANT -->
                <a href="login.html?role=current-tenant" class="role-button">
                    <span class="role-icon">👤</span>

                    <div>
                        <strong>Current Tenant</strong>
                        <small>Manage your rental information</small>
                    </div>
                </a>

                <!-- PROSPECTIVE TENANT -->
                <a href="login.html?role=prospective-tenant" class="role-button">
                    <span class="role-icon">🔑</span>

                    <div>
                        <strong>Prospective Tenant</strong>
                        <small>Find and apply for a unit</small>
                    </div>
                </a>

            </div>

            <p class="footer">
                © 2026 RentEase
            </p>

        </div>

    </div>

</body>
</html>
