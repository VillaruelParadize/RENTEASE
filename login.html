<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RentEase - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">
            🏠
        </div>

        <h1>RentEase</h1>

        <p class="login-subtitle" id="roleText">
            Login
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-button">

                Login

            </button>

            <div class="create-account">

    <p>
        Don't have an account?
        <a href="admin/create-account.html">
            Create Account
        </a>
    </p>

</div>

        </form>


        <p style="margin-top:20px;">

            <a href="index.html">
                ← Back to Role Selection
            </a>

        </p>


        <p class="login-footer">
            © 2026 RentEase
        </p>

    </div>

</div>


<script>

    
    // GET ROLE FROM WELCOME PAGE
    

    const urlParams =
        new URLSearchParams(window.location.search);

    const role =
        urlParams.get("role");


    // =====================================
    // SHOW SELECTED ROLE
    // =====================================

    const roleText =
        document.getElementById("roleText");


    if (role === "admin") {

        roleText.textContent = "Admin Login";

    }

    else if (role === "current-tenant") {

        roleText.textContent = "Current Tenant Login";

    }

    else {

        roleText.textContent = "Login";

    }

    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            // ADMIN
            if (role === "admin") {

                window.location.href =
                    "Admin/dashboard.html";

            }


            // CURRENT TENANT
            else if (role === "current-tenant") {

                window.location.href =
                    "Current-tenant/dashboard.html";

            }


            // NO ROLE
            else {

                alert("Please select a role first.");

                window.location.href =
                    "index.html";

            }

        });

</script>


</body>

</html>
